<!DOCTYPE html>
<!--
  The chat interface: one page, plain HTML + CSS + JavaScript, no build step.
  It calls POST /chat and keeps the session_id so follow-up questions work.
  Model output is always inserted as text (textContent), never as HTML.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Risk Agent</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #1d2430; --muted: #5d6675;
      --line: #e2e5ea; --accent: #1f5fbf; --user: #e8f0fc;
      --high: #1e7a46; --medium: #a36a00; --low: #b3261e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; flex-direction: column; height: 100vh;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 20px; background: var(--card); border-bottom: 1px solid var(--line);
    }
    header h1 { font-size: 17px; margin: 0; }
    header p { margin: 0; color: var(--muted); font-size: 13px; }
    button {
      font: inherit; cursor: pointer; border-radius: 8px;
      border: 1px solid var(--line); background: var(--card); padding: 6px 12px;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    .header-actions { display: flex; align-items: center; gap: 10px; }

    /* Round link to the team's Slack channel, with a label on hover. */
    #team-channel {
      position: relative; display: inline-flex; align-items: center; justify-content: center;
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--card); border: 1px solid var(--line); text-decoration: none;
    }
    #team-channel:hover { border-color: var(--muted); }
    #team-channel svg { width: 18px; height: 18px; }
    #team-channel[hidden] { display: none; }
    #team-channel::after {               /* the hover label */
      content: attr(data-label); position: absolute; top: 42px; right: 0;
      white-space: nowrap; font-size: 13px; font-weight: 400;
      background: var(--text); color: #fff; padding: 4px 8px; border-radius: 6px;
      opacity: 0; pointer-events: none; transition: opacity 0.15s;
    }
    #team-channel:hover::after, #team-channel:focus-visible::after { opacity: 1; }

    #thread { flex: 1; overflow-y: auto; padding: 20px; }
    .inner { max-width: 820px; margin: 0 auto; }

    .examples { color: var(--muted); }
    .examples button { display: block; margin: 8px 0; text-align: left; width: 100%; }

    .msg { margin: 14px 0; padding: 12px 16px; border-radius: 12px; }
    .user { background: var(--user); margin-left: 15%; white-space: pre-wrap; }
    .agent { background: var(--card); border: 1px solid var(--line); margin-right: 5%; }
    .error { background: #fdecea; color: var(--low); }
    .thinking { color: var(--muted); font-style: italic; }

    .badge {
      display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px;
      border-radius: 10px; color: #fff; margin-bottom: 6px;
    }
    .badge.high { background: var(--high); }
    .badge.medium { background: var(--medium); }
    .badge.low { background: var(--low); }

    table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 14px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

    details { margin-top: 8px; color: var(--muted); font-size: 14px; }
    summary { cursor: pointer; }
    details h4 { margin: 8px 0 2px; color: var(--text); font-size: 13px; }
    details ul { margin: 0; padding-left: 20px; }

    form {
      display: flex; gap: 8px; padding: 12px 20px;
      background: var(--card); border-top: 1px solid var(--line);
    }
    form .inner { display: flex; gap: 8px; width: 100%; }
    textarea {
      flex: 1; font: inherit; padding: 10px; resize: none; height: 44px;
      border: 1px solid var(--line); border-radius: 8px;
    }
    #send { background: var(--accent); color: #fff; border-color: var(--accent); padding: 0 18px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Weather Risk Agent</h1>
      <p>Which hubs are most exposed to weather disruption?</p>
    </div>
    <div class="header-actions">
      <!-- Shown only when the server has a team channel (ALERT_CHANNEL_URL). -->
      <a id="team-channel" hidden target="_blank" rel="noopener"
         data-label="Slack's Team Channel" aria-label="Slack's Team Channel">
        <!-- Slack logo -->
        <svg viewBox="0 0 122.8 122.8" aria-hidden="true">
          <path fill="#e01e5a" d="M25.8 77.6c0 7.1-5.8 12.9-12.9 12.9S0 84.7 0 77.6s5.8-12.9 12.9-12.9h12.9v12.9zm6.5 0c0-7.1 5.8-12.9 12.9-12.9s12.9 5.8 12.9 12.9v32.3c0 7.1-5.8 12.9-12.9 12.9s-12.9-5.8-12.9-12.9V77.6z"/>
          <path fill="#36c5f0" d="M45.2 25.8c-7.1 0-12.9-5.8-12.9-12.9S38.1 0 45.2 0s12.9 5.8 12.9 12.9v12.9H45.2zm0 6.5c7.1 0 12.9 5.8 12.9 12.9s-5.8 12.9-12.9 12.9H12.9C5.8 58.1 0 52.3 0 45.2s5.8-12.9 12.9-12.9h32.3z"/>
          <path fill="#2eb67d" d="M97 45.2c0-7.1 5.8-12.9 12.9-12.9s12.9 5.8 12.9 12.9-5.8 12.9-12.9 12.9H97V45.2zm-6.5 0c0 7.1-5.8 12.9-12.9 12.9s-12.9-5.8-12.9-12.9V12.9C64.7 5.8 70.5 0 77.6 0s12.9 5.8 12.9 12.9v32.3z"/>
          <path fill="#ecb22e" d="M77.6 97c7.1 0 12.9 5.8 12.9 12.9s-5.8 12.9-12.9 12.9-12.9-5.8-12.9-12.9V97h12.9zm0-6.5c-7.1 0-12.9-5.8-12.9-12.9s5.8-12.9 12.9-12.9h32.3c7.1 0 12.9 5.8 12.9 12.9s-5.8 12.9-12.9 12.9H77.6z"/>
        </svg>
      </a>
      <button id="new-chat" type="button">New conversation</button>
    </div>
  </header>

  <main id="thread">
    <div class="inner" id="messages">
      <div class="examples" id="examples">
        <p>Ask about the hubs, or try one of these:</p>
        <button type="button">Which hubs in the Midwest are most exposed to winter disruption?</button>
        <button type="button">Compare Miami and Houston in terms of hurricane and flood exposure.</button>
        <button type="button">What percentage of days in Denver last year had snowfall?</button>
        <button type="button">Why is the Dallas hub's weather disruption risk high?</button>
      </div>
    </div>
  </main>

  <form id="ask">
    <div class="inner">
      <textarea id="question" placeholder="Ask a question… (Enter to send, Shift+Enter for a new line)"></textarea>
      <button id="send" type="submit">Send</button>
    </div>
  </form>

  <script>
    const messages = document.getElementById("messages");
    const thread = document.getElementById("thread");
    const question = document.getElementById("question");
    const sendButton = document.getElementById("send");
    const examples = document.getElementById("examples");

    let sessionId = null;   // set by the first /chat reply; reused for follow-ups

    // Create an element with text (never HTML) and an optional class.
    function el(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    function addMessage(node) {
      messages.appendChild(node);
      thread.scrollTop = thread.scrollHeight;
      return node;
    }

    function list(title, items) {
      const box = el("div");
      box.appendChild(el("h4", title));
      const ul = el("ul");
      items.forEach(item => ul.appendChild(el("li", item)));
      box.appendChild(ul);
      return box;
    }

    // Show one structured answer (the FinalAnswer schema).
    function renderAnswer(answer) {
      const box = el("div", undefined, "msg agent");
      box.appendChild(el("span", answer.confidence + " confidence", "badge " + answer.confidence));
      box.appendChild(el("div", answer.answer));

      if (answer.ranking.length > 0) {
        const table = el("table");
        const head = el("tr");
        ["#", "Hub", "Category", "Score", "Why"].forEach(h => head.appendChild(el("th", h)));
        table.appendChild(head);
        answer.ranking.forEach((hub, i) => {
          const row = el("tr");
          row.appendChild(el("td", String(i + 1)));
          row.appendChild(el("td", hub.hub_name));
          row.appendChild(el("td", hub.category.replace("_", " ")));
          row.appendChild(el("td", hub.score.toFixed(1), "num"));
          row.appendChild(el("td", hub.note));
          table.appendChild(row);
        });
        box.appendChild(table);
      }

      const details = el("details");
      details.appendChild(el("summary", "How I got this"));
      details.appendChild(list("Reasoning", answer.reasoning));
      details.appendChild(list("Assumptions", answer.assumptions));
      box.appendChild(details);
      return box;
    }

    // Turn an error response from the API into one readable line.
    async function errorText(response) {
      try {
        const body = await response.json();
        if (typeof body.detail === "string") return body.detail;
        return body.detail.map(d => d.msg).join("; ");
      } catch {
        return "HTTP " + response.status;
      }
    }

    async function send(text) {
      text = text.trim();
      if (!text) return;
      examples.remove();
      addMessage(el("div", text, "msg user"));
      const waiting = addMessage(el("div", "Thinking… (checking the hub data)", "msg thinking"));
      question.value = "";
      sendButton.disabled = true;

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, session_id: sessionId }),
        });
        waiting.remove();
        if (!response.ok) {
          addMessage(el("div", "Sorry, something went wrong: " + await errorText(response), "msg error"));
          return;
        }
        const data = await response.json();
        sessionId = data.session_id;
        addMessage(renderAnswer(data.answer));
      } catch (error) {
        waiting.remove();
        addMessage(el("div", "Could not reach the server: " + error.message, "msg error"));
      } finally {
        sendButton.disabled = false;
        question.focus();
      }
    }

    document.getElementById("ask").addEventListener("submit", event => {
      event.preventDefault();
      send(question.value);
    });

    // Enter sends; Shift+Enter adds a new line.
    question.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        if (!sendButton.disabled) send(question.value);
      }
    });

    examples.querySelectorAll("button").forEach(button =>
      button.addEventListener("click", () => send(button.textContent)));

    // A new conversation = forget the session and reload the page.
    document.getElementById("new-chat").addEventListener("click", () => location.reload());

    // Show the team channel button if the server has a channel link.
    fetch("/team-channel")
      .then(response => response.json())
      .then(data => {
        if (data.url && data.url.startsWith("https://")) {   // never a javascript: link
          const link = document.getElementById("team-channel");
          link.href = data.url;
          link.hidden = false;
        }
      })
      .catch(() => {});   // no button if the request fails
  </script>
</body>
</html>
