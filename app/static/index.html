<!DOCTYPE html>
<!--
  The chat interface: one page, plain HTML + CSS + JavaScript, no build step.
  It calls POST /chat and keeps the session_id so follow-up questions work.
  Model output is always inserted as text (textContent), never as HTML.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Risk Agent</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #1d2430; --muted: #5d6675;
      --line: #e2e5ea; --accent: #1f5fbf; --user: #e8f0fc; --error: #b3261e;
      /* Risk level colours, used only for scores (never for confidence). */
      --severe: #c62828; --high: #e8710a; --moderate: #d4a20b; --low: #2e8b57;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; flex-direction: column; height: 100vh;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 20px; background: var(--card); border-bottom: 1px solid var(--line);
    }
    header h1 { font-size: 17px; margin: 0; }
    header p { margin: 0; color: var(--muted); font-size: 13px; }
    button {
      font: inherit; cursor: pointer; border-radius: 8px;
      border: 1px solid var(--line); background: var(--card); padding: 6px 12px;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    .header-actions { display: flex; align-items: center; gap: 10px; }

    /* Round link to the team's Slack channel, with a label on hover. */
    #team-channel {
      position: relative; display: inline-flex; align-items: center; justify-content: center;
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--card); border: 1px solid var(--line); text-decoration: none;
    }
    #team-channel:hover { border-color: var(--muted); }
    #team-channel svg { width: 18px; height: 18px; }
    #team-channel[hidden] { display: none; }
    #team-channel::after {               /* the hover label */
      content: attr(data-label); position: absolute; top: 42px; right: 0;
      white-space: nowrap; font-size: 13px; font-weight: 400;
      background: var(--text); color: #fff; padding: 4px 8px; border-radius: 6px;
      opacity: 0; pointer-events: none; transition: opacity 0.15s;
    }
    #team-channel:hover::after, #team-channel:focus-visible::after { opacity: 1; }

    #thread { flex: 1; overflow-y: auto; padding: 20px; }
    .inner { max-width: 820px; margin: 0 auto; }

    /* Empty state: the examples sit in the middle of the page. */
    #thread.empty { display: flex; align-items: center; }
    #thread.empty .inner { width: 100%; }
    .examples h2 { font-size: 22px; margin: 0 0 6px; }
    .examples p { color: var(--muted); margin: 0 0 20px; }
    .example-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .example-grid button {
      text-align: left; padding: 14px 16px; border-radius: 12px; line-height: 1.4;
    }
    .example-grid button:hover { border-color: var(--accent); background: var(--user); }
    @media (max-width: 600px) { .example-grid { grid-template-columns: 1fr; } }

    /* User and agent messages share the same right edge. */
    .msg { margin: 14px 0; padding: 12px 16px; border-radius: 12px; }
    .user { background: var(--user); margin-left: 15%; white-space: pre-wrap; }
    .agent { background: var(--card); border: 1px solid var(--line); }
    .error { background: #fdecea; color: var(--error); }
    .thinking { color: var(--muted); font-style: italic; }

    /* Confidence is a neutral label, so it is not confused with a risk level. */
    .confidence {
      display: inline-block; font-size: 12px; color: var(--muted); margin-bottom: 6px;
      border: 1px solid var(--line); border-radius: 10px; padding: 1px 8px;
    }
    .confidence b { color: var(--text); font-weight: 600; }

    .table-category { margin: 12px 0 0; font-size: 13px; color: var(--muted); }
    table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 14px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; white-space: nowrap; }
    td.nowrap { white-space: nowrap; }

    /* Score cell: the number next to a small bar filled to the score (0-100). */
    .score { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .score-num { width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
    .bar { width: 70px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
    .bar span { display: block; height: 100%; border-radius: 3px; }
    .bar .severe { background: var(--severe); }
    .bar .high { background: var(--high); }
    .bar .moderate { background: var(--moderate); }
    .bar .low { background: var(--low); }

    /* Legend under the table: what each bar colour means. */
    .legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 0 0 6px; font-size: 12px; color: var(--muted); }
    .legend span::before {
      content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      margin-right: 5px; background: var(--dot);
    }

    details { margin-top: 8px; color: var(--muted); font-size: 14px; }
    summary { cursor: pointer; }
    details h4 { margin: 8px 0 2px; color: var(--text); font-size: 13px; }
    details ul { margin: 0; padding-left: 20px; }

    form {
      display: flex; gap: 8px; padding: 12px 20px;
      background: var(--card); border-top: 1px solid var(--line);
    }
    form .inner { display: flex; gap: 8px; width: 100%; }
    textarea {
      flex: 1; font: inherit; padding: 10px; resize: none; height: 44px;
      border: 1px solid var(--line); border-radius: 8px;
    }
    #send { background: var(--accent); color: #fff; border-color: var(--accent); padding: 0 18px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Weather Risk Agent</h1>
      <p>Which hubs are most exposed to weather disruption?</p>
    </div>
    <div class="header-actions">
      <!-- Shown only when the server has a team channel (ALERT_CHANNEL_URL). -->
      <a id="team-channel" hidden target="_blank" rel="noopener"
         data-label="Team's Slack" aria-label="Team's Slack">
        <!-- Slack logo -->
        <svg viewBox="0 0 122.8 122.8" aria-hidden="true">
          <path fill="#e01e5a" d="M25.8 77.6c0 7.1-5.8 12.9-12.9 12.9S0 84.7 0 77.6s5.8-12.9 12.9-12.9h12.9v12.9zm6.5 0c0-7.1 5.8-12.9 12.9-12.9s12.9 5.8 12.9 12.9v32.3c0 7.1-5.8 12.9-12.9 12.9s-12.9-5.8-12.9-12.9V77.6z"/>
          <path fill="#36c5f0" d="M45.2 25.8c-7.1 0-12.9-5.8-12.9-12.9S38.1 0 45.2 0s12.9 5.8 12.9 12.9v12.9H45.2zm0 6.5c7.1 0 12.9 5.8 12.9 12.9s-5.8 12.9-12.9 12.9H12.9C5.8 58.1 0 52.3 0 45.2s5.8-12.9 12.9-12.9h32.3z"/>
          <path fill="#2eb67d" d="M97 45.2c0-7.1 5.8-12.9 12.9-12.9s12.9 5.8 12.9 12.9-5.8 12.9-12.9 12.9H97V45.2zm-6.5 0c0 7.1-5.8 12.9-12.9 12.9s-12.9-5.8-12.9-12.9V12.9C64.7 5.8 70.5 0 77.6 0s12.9 5.8 12.9 12.9v32.3z"/>
          <path fill="#ecb22e" d="M77.6 97c7.1 0 12.9 5.8 12.9 12.9s-5.8 12.9-12.9 12.9-12.9-5.8-12.9-12.9V97h12.9zm0-6.5c-7.1 0-12.9-5.8-12.9-12.9s5.8-12.9 12.9-12.9h32.3c7.1 0 12.9 5.8 12.9 12.9s-5.8 12.9-12.9 12.9H77.6z"/>
        </svg>
      </a>
      <button id="new-chat" type="button">New conversation</button>
    </div>
  </header>

  <main id="thread" class="empty">
    <div class="inner" id="messages">
      <div class="examples" id="examples">
        <h2>Which hubs are most at risk?</h2>
        <p>Ask about winter, hurricane, flood, severe storm or heat exposure for any hub or region.
          Answers use FEMA's National Risk Index and observed weather. Try one of these:</p>
        <div class="example-grid">
          <button type="button">Which hubs in the Midwest are most exposed to winter disruption?</button>
          <button type="button">Compare Miami and Houston in terms of hurricane and flood exposure.</button>
          <button type="button">What percentage of days in Denver last year had snowfall?</button>
          <button type="button">Why is the Dallas hub's weather disruption risk high?</button>
        </div>
      </div>
    </div>
  </main>

  <form id="ask">
    <div class="inner">
      <textarea id="question" placeholder="Ask a question… (Enter to send, Shift+Enter for a new line)"></textarea>
      <button id="send" type="submit">Send</button>
    </div>
  </form>

  <script>
    const messages = document.getElementById("messages");
    const thread = document.getElementById("thread");
    const question = document.getElementById("question");
    const sendButton = document.getElementById("send");
    const examples = document.getElementById("examples");

    let sessionId = null;   // set by the first /chat reply; reused for follow-ups

    // Create an element with text (never HTML) and an optional class.
    function el(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    function addMessage(node) {
      messages.appendChild(node);
      thread.scrollTop = thread.scrollHeight;
      return node;
    }

    function list(title, items) {
      const box = el("div");
      box.appendChild(el("h4", title));
      const ul = el("ul");
      items.forEach(item => ul.appendChild(el("li", item)));
      box.appendChild(ul);
      return box;
    }

    // A score in words. Same bands as RISK_LEVELS in app/scoring_config.py.
    function riskLevel(score) {
      if (score >= 80) return "severe";
      if (score >= 60) return "high";
      if (score >= 30) return "moderate";
      return "low";
    }

    // The score as a number plus a small bar coloured by its risk level.
    function scoreCell(score) {
      const level = riskLevel(score);
      const td = el("td");
      td.title = level + " risk";
      const wrap = el("div", undefined, "score");
      wrap.appendChild(el("span", score.toFixed(1), "score-num"));
      const bar = el("div", undefined, "bar");
      const fill = el("span", undefined, level);
      fill.style.width = Math.min(Math.max(score, 0), 100) + "%";
      bar.appendChild(fill);
      wrap.appendChild(bar);
      td.appendChild(wrap);
      return td;
    }

    function rankingTable(ranking) {
      // When every row has the same category, say it once instead of in a column.
      const categories = new Set(ranking.map(hub => hub.category));
      const oneCategory = categories.size === 1;
      const name = category => category.replace("_", " ");

      const wrap = el("div");
      if (oneCategory) {
        wrap.appendChild(el("p", "Category: " + name(ranking[0].category), "table-category"));
      }
      const table = el("table");
      const head = el("tr");
      const columns = oneCategory ? ["#", "Hub", "Score", "Why"] : ["#", "Hub", "Category", "Score", "Why"];
      columns.forEach(h => head.appendChild(el("th", h)));
      table.appendChild(head);
      ranking.forEach((hub, i) => {
        const row = el("tr");
        row.appendChild(el("td", String(i + 1)));
        row.appendChild(el("td", hub.hub_name, "nowrap"));
        if (!oneCategory) row.appendChild(el("td", name(hub.category), "nowrap"));
        row.appendChild(scoreCell(hub.score));
        row.appendChild(el("td", hub.note));
        table.appendChild(row);
      });
      wrap.appendChild(table);
      wrap.appendChild(legend());
      return wrap;
    }

    // One line explaining the bar colours (same bands as riskLevel above).
    function legend() {
      const box = el("div", undefined, "legend");
      [["Severe 80+", "--severe"], ["High 60–79", "--high"],
       ["Moderate 30–59", "--moderate"], ["Low 0–29", "--low"]].forEach(([label, colour]) => {
        const item = el("span", label);
        item.style.setProperty("--dot", "var(" + colour + ")");
        box.appendChild(item);
      });
      return box;
    }

    // Show one structured answer (the FinalAnswer schema).
    function renderAnswer(answer) {
      const box = el("div", undefined, "msg agent");
      const confidence = el("span", "Confidence: ", "confidence");
      confidence.appendChild(el("b", answer.confidence));
      box.appendChild(confidence);
      box.appendChild(el("div", answer.answer));

      if (answer.ranking.length > 0) box.appendChild(rankingTable(answer.ranking));

      const details = el("details");
      details.appendChild(el("summary", "How I got this"));
      details.appendChild(list("Reasoning", answer.reasoning));
      details.appendChild(list("Assumptions", answer.assumptions));
      box.appendChild(details);
      return box;
    }

    // Turn an error response from the API into one readable line.
    async function errorText(response) {
      try {
        const body = await response.json();
        if (typeof body.detail === "string") return body.detail;
        return body.detail.map(d => d.msg).join("; ");
      } catch {
        return "HTTP " + response.status;
      }
    }

    async function send(text) {
      text = text.trim();
      if (!text) return;
      examples.remove();
      thread.classList.remove("empty");
      addMessage(el("div", text, "msg user"));
      const waiting = addMessage(el("div", "Thinking… (checking the hub data)", "msg thinking"));
      question.value = "";
      sendButton.disabled = true;

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, session_id: sessionId }),
        });
        waiting.remove();
        if (!response.ok) {
          addMessage(el("div", "Sorry, something went wrong: " + await errorText(response), "msg error"));
          return;
        }
        const data = await response.json();
        sessionId = data.session_id;
        addMessage(renderAnswer(data.answer));
      } catch (error) {
        waiting.remove();
        addMessage(el("div", "Could not reach the server: " + error.message, "msg error"));
      } finally {
        sendButton.disabled = false;
        question.focus();
      }
    }

    document.getElementById("ask").addEventListener("submit", event => {
      event.preventDefault();
      send(question.value);
    });

    // Enter sends; Shift+Enter adds a new line.
    question.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        if (!sendButton.disabled) send(question.value);
      }
    });

    examples.querySelectorAll("button").forEach(button =>
      button.addEventListener("click", () => send(button.textContent)));

    // A new conversation = forget the session and reload the page.
    document.getElementById("new-chat").addEventListener("click", () => location.reload());

    // Show the team channel button if the server has a channel link.
    fetch("/team-channel")
      .then(response => response.json())
      .then(data => {
        if (data.url && data.url.startsWith("https://")) {   // never a javascript: link
          const link = document.getElementById("team-channel");
          link.href = data.url;
          link.hidden = false;
        }
      })
      .catch(() => {});   // no button if the request fails
  </script>
</body>
</html>
